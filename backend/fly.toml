# REPLACE with your own app name before `fly launch`/`fly deploy`.
app = "reeds"
primary_region = "iad"

[build]
  # Dockerfile lives in this directory (backend/)
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  APP_ENV = "production"
  # Fly runs the heavier inference/prediction worker. Render keeps the
  # scheduler leader; set this to "false"/"yes" if you want Fly to own the
  # schedule instead (the advisory lock prevents both from duplicating work).
  ENABLE_SCHEDULER = "false"
  SCHEDULE_DISABLED = "1"

[[services]]
  protocol = "tcp"
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.checks]]
    grace_period = "45s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[metrics]
  port = 8000
  path = "/health"

# All secrets are provided via `fly secrets set`:
#   DATABASE_URL, ADMIN_API_KEY, CRON_SECRET, THE_ODDS_API_KEY, ...
# Never commit real secrets to the repository.