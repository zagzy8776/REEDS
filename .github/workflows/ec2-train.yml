# REEDS EC2 training workflow — DEPRECATED, kept for reference only.
#
# GitHub Actions is NO LONGER the EC2 training executor as of commit b9022f0.
# Training now runs DIRECTLY on the AWS EC2 "REEDS TRAINING" instance via:
#
#   /home/ubuntu/reeds-venv/bin/python \
#     /home/ubuntu/REEDS/backend/scripts/ec2_train_worker.py run-all
#
# Triggered remotely by the request-file poller:
#   backend/scripts/ec2_training_trigger.py (systemd: reeds-train-trigger.service)
#
# This workflow file is kept only so the Actions tab does not break.
# It performs NO training. Remove it once the migration is confirmed stable.

name: EC2 Training Worker

on:
  workflow_dispatch:
    inputs:
      sports:
        description: "Comma-separated sports (ignored — training runs on EC2 directly)"
        required: false
        default: ""
  repository_dispatch:
    types: [reeds-training]

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - name: Training no longer runs here
        run: |
          echo "GitHub Actions is no longer the EC2 training executor."
          echo "Training runs directly on the EC2 instance via the request-file trigger."
          echo "See deploy/ec2/reeds-train-trigger.service and backend/scripts/ec2_training_trigger.py"