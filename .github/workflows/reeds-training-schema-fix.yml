name: REEDS training schema fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch training feature integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          train = Path('backend/app/ml/train.py')
          s = train.read_text()
          dead = {
              'sharp_home_move', 'sharp_away_move', 'clv_home_signal',
              'insider_sharp_home_move', 'insider_sharp_away_move',
              'insider_clv_home', 'insider_steam', 'insider_opening_home_prob',
              'insider_weather_precip', 'insider_weather_wind',
              'insider_home_injury', 'insider_away_injury',
              'insider_referee_cards', 'insider_public_home_pct',
          }
          lines = s.splitlines()
          out = []
          in_features = False
          for line in lines:
              if line.startswith('FEATURES = ['):
                  in_features = True
              if in_features and any(f'"{name}"' in line for name in dead):
                  continue
              out.append(line)
              if in_features and line == ']':
                  in_features = False
          s = '\n'.join(out) + '\n'
          if '"h2h_meetings"' not in s:
              marker = '    "h2h_last3_away_goals",'
              if marker not in s:
                  raise SystemExit('train.py H2H marker not found')
              s = s.replace(marker, marker + '\n    "h2h_meetings",', 1)
          train.write_text(s)

          p = Path('backend/app/ml/features.py')
          s = p.read_text()

          # H2H count is explicit evidence, even for 0/1 prior meetings.
          s, n = re.subn(
              r'("h2h_avg_total_goals": 2\.5,\n)(\s*\})',
              r'\1            "h2h_meetings": float(record["total"]) if record else 0.0,\n\2',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('H2H cold-start return not found')

          s, n = re.subn(
              r'("h2h_last3_away_goals":\s+l3a_avg,\n)(\s*\})',
              r'\1        "h2h_meetings":              float(total),\n\2',
              s,
              count=1,
          )
          if n != 1:
              raise SystemExit('H2H full return not found')

          # Only change the supervised training builder; leave live inference API
          # feature output untouched so runtime signals remain available.
          marker = '\ndef features_for_fixture('
          if marker not in s:
              raise SystemExit('features_for_fixture boundary not found')
          training, live = s.split(marker, 1)

          training, n = re.subn(
              r'rows\.append\(\{\n(\s*# --- Core form ---)',
              r'feature_row = {\n\1',
              training,
              count=1,
          )
          if n != 1:
              raise SystemExit('training row start not found')

          if '"h2h_meetings"' not in training:
              marker2 = '            "h2h_last3_away_goals":    h2h_feats.get("h2h_last3_away_goals", 1.1),'
              if marker2 not in training:
                  raise SystemExit('training H2H row marker not found')
              training = training.replace(marker2, marker2 + '\n            "h2h_meetings":             h2h_feats.get("h2h_meetings", 0.0),', 1)

          old_end = '''        })\n        y.append(normalize_result(hs, aas))\n        home_entry = {'''
          new_end = '''        }\n        if len(hh) >= 5 and len(ah) >= 5:\n            rows.append(feature_row)\n            y.append(normalize_result(hs, aas))\n        home_entry = {'''
          if old_end not in training:
              raise SystemExit('training row end not found')
          training = training.replace(old_end, new_end, 1)

          # The historical training corpus has actual bookmaker odds, but does
          # not have opening/closing line movement or insider/weather/injury data.
          # Do not train on synthetic zeros for those unavailable signals.
          training = '\n'.join(
              line for line in training.splitlines()
              if not any(f'"{name}"' in line for name in (
                  'sharp_home_move', 'sharp_away_move', 'clv_home_signal',
                  'insider_sharp_home_move', 'insider_sharp_away_move',
                  'insider_clv_home', 'insider_steam', 'insider_opening_home_prob',
                  'insider_weather_precip', 'insider_weather_wind',
                  'insider_home_injury', 'insider_away_injury',
                  'insider_referee_cards', 'insider_public_home_pct',
              ))
          ) + '\n'

          p.write_text(training + marker + live)
          print('PATCHED')
          PY

          python3 -m py_compile backend/app/ml/features.py backend/app/ml/train.py backend/app/ml/train_oof.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/ml/features.py backend/app/ml/train.py .github/workflows/reeds-training-schema-fix.yml
          git rm .github/workflows/reeds-training-schema-fix.yml
          git commit -m 'fix: align soccer training features with real historical evidence'
          git push