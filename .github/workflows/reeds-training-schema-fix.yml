name: REEDS training schema fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch training feature integrity
        run: |
          python3 - <<'PY'
          from pathlib import Path

          train = Path('backend/app/ml/train.py')
          s = train.read_text()

          dead = [
              'sharp_home_move', 'sharp_away_move', 'clv_home_signal',
              'insider_sharp_home_move', 'insider_sharp_away_move',
              'insider_clv_home', 'insider_steam', 'insider_opening_home_prob',
              'insider_weather_precip', 'insider_weather_wind',
              'insider_home_injury', 'insider_away_injury',
              'insider_referee_cards', 'insider_public_home_pct',
          ]
          for name in dead:
              s = '\n'.join(line for line in s.splitlines() if f'"{name}"' not in line) + '\n'

          if '"h2h_meetings"' not in s:
              needle = '    "h2h_last3_away_goals",      # avg away goals in last 3 H2H meetings\n'
              if needle not in s:
                  raise SystemExit('train.py H2H insertion point not found')
              s = s.replace(needle, needle + '    "h2h_meetings",             # actual prior H2H meetings\n', 1)
          train.write_text(s)

          p = Path('backend/app/ml/features.py')
          s = p.read_text()

          # Expose actual H2H meeting count, including small samples.
          old = '''    if not record or record["total"] < 2:\n        return {\n            "h2h_home_win_rate": 0.50,\n            "h2h_draw_rate": 0.25,\n            "h2h_away_win_rate": 0.25,\n            "h2h_avg_total_goals": 2.5,\n        }'''
          new = '''    if not record or record["total"] < 2:\n        return {\n            "h2h_home_win_rate": 0.50,\n            "h2h_draw_rate": 0.25,\n            "h2h_away_win_rate": 0.25,\n            "h2h_avg_total_goals": 2.5,\n            "h2h_meetings": float(record["total"]) if record else 0.0,\n        }'''
          if old not in s:
              raise SystemExit('features.py H2H cold branch not found')
          s = s.replace(old, new, 1)

          old = '''        "h2h_last3_home_goals":    l3h_avg,\n        "h2h_last3_away_goals":    l3a_avg,\n    }'''
          new = '''        "h2h_last3_home_goals":    l3h_avg,\n        "h2h_last3_away_goals":    l3a_avg,\n        "h2h_meetings":              float(total),\n    }'''
          if old not in s:
              raise SystemExit('features.py H2H full branch not found')
          s = s.replace(old, new, 1)

          # Keep cold-start fixtures in the chronological state trackers, but
          # exclude them from supervised training so defaults cannot become labels/features.
          old = '''        rows.append({\n            # --- Core form ---'''
          new = '''        feature_row = {\n            # --- Core form ---'''
          if old not in s:
              raise SystemExit('features.py training row start not found')
          s = s.replace(old, new, 1)

          old = '''            "h2h_last3_home_goals":    h2h_feats.get("h2h_last3_home_goals", 1.3),\n            "h2h_last3_away_goals":    h2h_feats.get("h2h_last3_away_goals", 1.1),'''
          new = '''            "h2h_last3_home_goals":    h2h_feats.get("h2h_last3_home_goals", 1.3),\n            "h2h_last3_away_goals":    h2h_feats.get("h2h_last3_away_goals", 1.1),\n            "h2h_meetings":             h2h_feats.get("h2h_meetings", 0.0),'''
          if old not in s:
              raise SystemExit('features.py H2H row insertion point not found')
          s = s.replace(old, new, 1)

          old = '''        })\n        y.append(normalize_result(hs, aas))\n        home_entry = {'''
          new = '''        }\n        if len(hh) >= 5 and len(ah) >= 5:\n            rows.append(feature_row)\n            y.append(normalize_result(hs, aas))\n        home_entry = {'''
          if old not in s:
              raise SystemExit('features.py training row end not found')
          s = s.replace(old, new, 1)

          # Remove training-only dead market movement fields. Live inference may
          # still expose them, but they are not part of the trained feature schema.
          for name in ('sharp_home_move', 'sharp_away_move', 'clv_home_signal'):
              s = '\n'.join(line for line in s.splitlines() if f'"{name}"' not in line) + '\n'

          p.write_text(s)
          print('PATCHED')
          PY

          python3 -m py_compile backend/app/ml/features.py backend/app/ml/train.py backend/app/ml/train_oof.py

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/ml/features.py backend/app/ml/train.py .github/workflows/reeds-training-schema-fix.yml
          git rm .github/workflows/reeds-training-schema-fix.yml
          git commit -m 'fix: align soccer training features with real historical evidence'
          git push