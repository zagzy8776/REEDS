name: Deploy HF Space

on:
  push:
    branches: [main]
    paths:
      - "huggingface_space/**"
      - ".github/workflows/deploy-hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reeds-hf-space
  cancel-in-progress: true

jobs:
  deploy:
    name: Sync REEDS worker to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout REEDS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate worker source
        run: |
          set -euo pipefail
          python -m py_compile huggingface_space/app.py
          test -s huggingface_space/app.py
          test -s huggingface_space/requirements.txt
          echo "Worker source validated"

      - name: Require HF write credential
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          echo "HF_TOKEN is configured"

      - name: Sync files to Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: Zagzy/reeds-ml-worker
        run: |
          set -euo pipefail

          git config --global user.email "ci@reeds.ai"
          git config --global user.name "REEDS CI"

          rm -rf hf_space_repo
          git clone "https://Zagzy:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf_space_repo

          cp huggingface_space/app.py hf_space_repo/app.py
          cp huggingface_space/requirements.txt hf_space_repo/requirements.txt
          cp huggingface_space/runtime.txt hf_space_repo/runtime.txt
          cp huggingface_space/README.md hf_space_repo/README.md

          cd hf_space_repo
          git add app.py requirements.txt runtime.txt README.md

          if git diff --cached --quiet; then
            echo "HF Space is already synchronized"
            exit 0
          fi

          git commit -m "Sync REEDS ML worker $(git -C .. rev-parse --short HEAD)"
          git push origin HEAD:main

      - name: Verify Space revision
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: Zagzy/reeds-ml-worker
        run: |
          set -euo pipefail
          rm -rf hf_verify
          git clone --depth=1 "https://Zagzy:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_REPO}" hf_verify
          cmp huggingface_space/app.py hf_verify/app.py
          cmp huggingface_space/requirements.txt hf_verify/requirements.txt
          cmp huggingface_space/runtime.txt hf_verify/runtime.txt
          echo "HF Space verification passed"
