name: SportyBet integration tests

on:
  push:
    paths:
      - "backend/app/scraper/sportybet.py"
      - "backend/tests/test_sportybet.py"
      - ".github/workflows/sportybet-test.yml"
  pull_request:
    paths:
      - "backend/app/scraper/sportybet.py"
      - "backend/tests/test_sportybet.py"
      - ".github/workflows/sportybet-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest requests
      - run: PYTHONPATH=backend pytest -q backend/tests/test_sportybet.py
