name: Provider reliability hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/provider-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch provider ingestion
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # loaders.py: make natural-key upserts safe against concurrent providers
          path = Path('backend/app/scraper/loaders.py')
          text = path.read_text(encoding='utf-8')
          if 'from sqlalchemy.exc import IntegrityError' not in text:
              text = text.replace('from sqlalchemy.orm import Session\n', 'from sqlalchemy.orm import Session\nfrom sqlalchemy.exc import IntegrityError\n', 1)

          pattern = re.compile(r'def upsert_fixture\(db: Session, fixture: Fixture\) -> None:\n.*?(?=\n\ndef _to_int_or_none)', re.S)
          replacement = '''def upsert_fixture(db: Session, fixture: Fixture) -> None:
              """Insert/update a fixture while tolerating concurrent provider inserts."""
              if fixture.extra is None:
                  fixture.extra = {}
              fixture.league = _country_qualified_league(fixture.league, fixture.extra)

              def _find_existing():
                  return (
                      db.query(Fixture)
                      .filter(
                          Fixture.sport == fixture.sport,
                          Fixture.league == fixture.league,
                          Fixture.match_date == fixture.match_date,
                          Fixture.home_team == fixture.home_team,
                          Fixture.away_team == fixture.away_team,
                      )
                      .first()
                  )

              def _merge(existing):
                  existing.season = fixture.season or existing.season
                  if fixture.home_score is not None:
                      existing.home_score = fixture.home_score
                  if fixture.away_score is not None:
                      existing.away_score = fixture.away_score
                  if fixture.home_odds is not None:
                      existing.home_odds = fixture.home_odds
                  if fixture.draw_odds is not None:
                      existing.draw_odds = fixture.draw_odds
                  if fixture.away_odds is not None:
                      existing.away_odds = fixture.away_odds
                  existing.source = fixture.source or existing.source
                  existing.extra = _merge_extra(existing, fixture.extra)

              existing = _find_existing()
              if existing:
                  _merge(existing)
                  return

              fixture.extra = _merge_extra(fixture, fixture.extra)
              try:
                  with db.begin_nested():
                      db.add(fixture)
                      db.flush()
              except IntegrityError:
                  existing = _find_existing()
                  if existing is None:
                      raise
                  _merge(existing)
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('upsert_fixture patch target not found')

          # loaders.py: split football-data.org requests into <=10-day windows
          pattern = re.compile(r'def ingest_football_data_org_matches\(db: Session, api_key: str, target_dates: list\[str\]\) -> int:\n.*?(?=\n\ndef ingest_apifootball_com_events)', re.S)
          replacement = '''def ingest_football_data_org_matches(db: Session, api_key: str, target_dates: list[str]) -> int:
              client = FootballDataOrgClient(api_key)
              if not target_dates:
                  return 0

              count = 0
              for start in range(0, len(target_dates), 10):
                  chunk = target_dates[start:start + 10]
                  payload = client.matches_by_range(chunk[0], chunk[-1])
                  for item in payload.get('matches', []) or []:
                      match_date = pd.to_datetime(item.get('utcDate'), errors='coerce')
                      home = item.get('homeTeam') or {}
                      away = item.get('awayTeam') or {}
                      score = item.get('score') or {}
                      full_time = score.get('fullTime') or {}
                      if pd.isna(match_date) or not home.get('name') or not away.get('name'):
                          continue
                      comp = item.get('competition') or {}
                      area = item.get('area') or {}
                      fx = Fixture(
                          sport='soccer',
                          league=comp.get('name') or 'Football',
                          season=str((item.get('season') or {}).get('startDate') or match_date.year)[:4],
                          match_date=match_date.date(),
                          home_team=resolve_team_name(db, str(home.get('name')), 'soccer', 'football_data_org'),
                          away_team=resolve_team_name(db, str(away.get('name')), 'soccer', 'football_data_org'),
                          home_score=_to_int_or_none(full_time.get('home')),
                          away_score=_to_int_or_none(full_time.get('away')),
                          source='football_data_org',
                          extra={
                              'football_data_match_id': item.get('id'),
                              'status': item.get('status'),
                              'country': area.get('name'),
                              'competition_code': comp.get('code'),
                          },
                      )
                      upsert_fixture(db, fx)
                      count += 1
                  db.commit()
              return count
'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('football-data.org patch target not found')
          path.write_text(text, encoding='utf-8')

          # coverage_sources.py: real OpenFoot API requires authentication;
          # isolate invalid-key responses without pretending no-key access works.
          path = Path('backend/app/scraper/coverage_sources.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'These providers are optional. OpenFoot also supports public/no-key requests for\nbasic fixture access, which gives REEDS a last-resort recovery path when keyed\nfeeds are temporarily unavailable.\n',
              'These providers are optional. OpenFoot requires an API key for production requests.\n',
              1,
          )
          old = '''        response = session.get(
            f"{OPENFOOT_BASE}/matches",
            params={"date": target_date},
            headers=headers,
            timeout=20,
        )
        response.raise_for_status()
'''
          new = '''        try:
            response = session.get(
                f"{OPENFOOT_BASE}/matches",
                params={"date": target_date},
                headers=headers,
                timeout=20,
            )
            response.raise_for_status()
        except requests.HTTPError as exc:
            if getattr(exc.response, "status_code", None) in {401, 403}:
                return count
            raise
'''
          if old not in text:
              raise SystemExit('OpenFoot patch target not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # web_score_sources.py: reject parser garbage and isolate duplicate races.
          path = Path('backend/app/scraper/web_score_sources.py')
          text = path.read_text(encoding='utf-8')
          marker = 'def _persist_pairs(db: Session, pairs: list[tuple[date, str, str]], source: str, sport: str) -> int:\n'
          helper = '''def _valid_team_name(value: str) -> bool:
              normalized = _normalise_space(value)
              low = normalized.lower()
              if len(normalized) < 2 or len(normalized) > 80:
                  return False
              if any(token in low for token in ("http://", "https://", ".com/", "copyright", "google play", "app store")):
                  return False
              if low.startswith(("score.com/", "www.", "android application")):
                  return False
              return True


          def _persist_pairs(db: Session, pairs: list[tuple[date, str, str]], source: str, sport: str) -> int:
'''
          if marker not in text:
              raise SystemExit('web persistence target not found')
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '        try:\n            fx = Fixture(\n                sport=sport,\n                league=f"{source.title()} {sport.replace(\'_\', \' \').title()}",\n',
              '        try:\n            if not _valid_team_name(home) or not _valid_team_name(away):\n                continue\n            fx = Fixture(\n                sport=sport,\n                # Never invent a competition name from the website source.\n                league="Web fixtures",\n',
              1,
          )
          text = text.replace(
              '            upsert_fixture(db, fx); persisted += 1\n        except Exception:\n',
              '            with db.begin_nested():\n                upsert_fixture(db, fx)\n                db.flush()\n            persisted += 1\n        except Exception:\n',
              1,
          )
          path.write_text(text, encoding='utf-8')
          print('Provider hotfix source edits complete')
          PY

      - name: Validate Python sources
        run: python -m compileall -q backend/app

      - name: Commit and push source fixes
        run: |
          set -euo pipefail
          git config user.email "ci@reeds.ai"
          git config user.name "REEDS CI"
          git add backend/app/scraper/loaders.py backend/app/scraper/coverage_sources.py backend/app/scraper/web_score_sources.py .github/workflows/provider-hotfix.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix provider range auth and fixture persistence"
          git push origin HEAD:main
