name: REEDS deep audit fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply backend data-quality fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  print(f"SKIP {path}: pattern not found")
                  return False
              p.write_text(text.replace(old, new, 1))
              print(f"UPDATED {path}")
              return True

          # Use the historical corpus for prediction generation. A 90-day
          # window is too short across season breaks and silently creates the
          # same league-average feature vector for unrelated fixtures.
          replace_once(
              "backend/app/services/predictions.py",
              "history = dataframe_from_db(db, max_age_days=90)",
              "history = dataframe_from_db(db, max_age_days=730)",
          )

          # Stop the broad web-score scraper that is creating malformed fixture
          # rows from page text. Keep the implementation in the repository for
          # forensic reference, but do not ingest it into production.
          scheduler = Path("backend/app/services/scheduler.py")
          text = scheduler.read_text()
          text = text.replace("from app.scraper.web_score_sources import ingest_web_score_sources\n", "")
          text = text.replace("\n        providers.append((\"web_score_sources\", ingest_web_score_sources, (db, dates, 9), {}))\n", "\n")
          scheduler.write_text(text)

          # Make the generic sport path refuse obvious web-page garbage instead
          # of turning it into a prediction.
          generic = Path("backend/app/ml/generic.py")
          text = generic.read_text()
          marker = '        sport = fixture.get("sport") or "sport"\n'
          guard = '''        sport = fixture.get("sport") or "sport"\n        home_raw = str(fixture.get("home_team") or "").strip()\n        away_raw = str(fixture.get("away_team") or "").strip()\n        bad_markers = (\n            "livescore.in", "web fixtures", "webfixture",\n            "references link on the bottom", "floating icon",\n            "provides bettors", "user id:", "users id:",\n        )\n        raw_text = f"{home_raw} {away_raw}".lower()\n        if (not home_raw or not away_raw or len(home_raw) > 90 or len(away_raw) > 90\n                or any(marker in raw_text for marker in bad_markers)\n                or "user id" in home_raw.lower() or "user id" in away_raw.lower()):\n            return []\n'''
          if marker in text and 'bad_markers = (' not in text:
              generic.write_text(text.replace(marker, guard, 1))
              print("UPDATED backend/app/ml/generic.py")

          # The one-off patch has done its work; remove this workflow from the
          # repository in the same bot commit so it cannot run again.
          workflow = Path(".github/workflows/deep-audit-fix.yml")
          workflow.unlink(missing_ok=True)
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/services/predictions.py backend/app/services/scheduler.py backend/app/ml/generic.py .github/workflows/deep-audit-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix: quarantine malformed web fixtures and expand prediction history"
          git push origin main
